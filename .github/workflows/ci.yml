name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

# Notes:
# - MetaTrader5 is Windows-only and is skipped automatically on this
#   ubuntu-latest runner (see the platform marker in requirements.txt).
# - No live/demo trading, broker API keys, or real market data are used
#   here: only the pure-logic execution-replay engine and CRT/Supply-Demand
#   structural detector are unit tested, against synthetic fixture data.
