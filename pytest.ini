[pytest]
# Test files in this repo use a "C_test_*.py" naming convention (not
# pytest's default "test_*.py"/"*_test.py"), so the pattern must be set
# explicitly or `pytest` silently collects zero tests.
python_files = C_test_*.py test_*.py *_test.py
python_classes = *Tests Test*
python_functions = test_*
testpaths = EURUSD_research
